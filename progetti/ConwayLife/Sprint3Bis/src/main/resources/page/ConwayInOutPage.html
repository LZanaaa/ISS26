<!--  INPUT AREA   -->
	<div id="controlsArea" style="display: none; padding: 10px; background-color: #f0f8ff; border: 1px solid #b0d4ff; margin-bottom: 10px;">
	  <strong style="color: red;">SEI L'OWNER!</strong><br><br>
	  <button onClick="sendCmdToServer('start'); return false">START</button>
	  <button onClick="sendCmdToServer('stop');  return false">STOP</button>
	  <button onClick="sendCmdToServer('clear'); return false">CLEAR</button>
	  <button onClick="sendCmdToServer('exit');  return false">EXIT</button>
	</div>
	<div id="observerMsg" style="display: none; padding: 10px; background-color: #ffe4e1; border: 1px solid #ffb6c1; margin-bottom: 10px;">
	  <strong>Sei un OBSERVER.</strong> Un altro utente sta controllando il gioco.
	</div>

  
<!-- MAP AREA -->
 
    <div >

      <div id="map" class="grid"></div>
    </div>

	  <ol id="msgslist"></ol>

	  <button type="button" onclick=clearOutArea()>Remove Messages</button>
